name: buildflow_mobile
description: BuildFlow mobile app (offline-first)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

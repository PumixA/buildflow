services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npm run start:dev
    environment:
      NODE_ENV: development
    volumes:
      - ./src:/usr/src/app/src
      - ./services:/usr/src/app/services
      - ./libs:/usr/src/app/libs
      - ./infra:/usr/src/app/infra
      - ./test:/usr/src/app/test
      - ./data:/usr/src/app/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    command: npm --workspace apps/web run dev -- --hostname 0.0.0.0
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web/src:/usr/src/app/apps/web/src 2>/dev/null
      - ./apps/web/app:/usr/src/app/apps/web/app
      - ./apps/web/components:/usr/src/app/apps/web/components
      - ./apps/web/lib:/usr/src/app/apps/web/lib
      - ./apps/web/public:/usr/src/app/apps/web/public 2>/dev/null
